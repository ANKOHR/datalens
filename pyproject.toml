[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalens"
version = "0.1.0"
description = "Deterministic spreadsheet profiling and heuristic analysis CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "matplotlib>=3.7"]

[project.scripts]
datalens = "datalens.cli:main"

[tool.setuptools]
packages = ["datalens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
